version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corptemp_user}
      # No default on purpose — compose must fail loudly rather than silently use a weak password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see docs/DEPLOY_GUIDE.md section 6.1)}"
      POSTGRES_DB: ${POSTGRES_DB:-corptemp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corptemp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-corptemp_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-corptemp_db}"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8019}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Where the **frontend container** reaches the backend, for the Next server's `/api/*` rewrite
        # and for server-side fetches: the compose service name plus the port the backend listens on
        # *inside* its container (8000 — not the published ${BACKEND_PORT:-8019}). The value is baked
        # into the bundle at build time and the browser never dials it (pages call their own origin and
        # are proxied). A deployment where the API sits elsewhere overrides it, e.g.
        # NEXT_PUBLIC_API_URL=https://api.example.com (task 041; was http://localhost:8019, which only
        # works when both processes share the host's network).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3019}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
